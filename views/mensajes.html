<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Angel mp3 - Mensajes</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
    <style>
        *, body, a, button, select, input {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="%23ffb6c1" stroke="%23ff007f" stroke-width="1.5"><path d="M4.5 3.5L11.5 20.5L14.5 13.5L21.5 10.5L4.5 3.5Z"/></svg>'), auto !important;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            width: 12px;
            height: 12px;
            background-color: #ff007f;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            z-index: 9999;
            transform: translate(-50%, -50%) scale(1);
            animation: sparkle-anim 0.8s forwards linear;
        }

        @keyframes sparkle-anim {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2) translateY(20px) rotate(180deg);
            }
        }

        .falling-item {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: fall linear forwards;
        }

        .falling-item svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.95;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes pulseAndMoveStars {
            0% { 
                transform: translateY(0px) scale(1) rotate(0deg); 
            }
            50% { 
                transform: translateY(-8px) scale(1.18) rotate(6deg); 
            }
            100% { 
                transform: translateY(0px) scale(1) rotate(0deg); 
            }
        }

        .bg-stars {
            position: absolute;
            bottom: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 1;
            display: flex;
            gap: 6px;
            align-items: flex-end;
            animation: pulseAndMoveStars 2.5s ease-in-out infinite;
        }

        html {
            overflow-y: scroll;
        }

        ::-webkit-scrollbar {
            width: 16px;
            background-color: #ffe4e1;
        }

        ::-webkit-scrollbar-track {
            background: #ffd0e3;
            border-left: 2px solid #ff007f;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff66b2;
            border: 2px solid #ffffff;
            outline: 1px solid #ff007f;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff007f;
        }

        body {
            margin: 0;
            padding: 0;
            background-image: url('../img/fondo.jfif');
            background-repeat: repeat;
            background-size: 600px auto;
            font-family: 'Comic Sans MS', 'Courier New', sans-serif;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .y2k-desktop {
            width: 100%;
            max-width: 920px;
            padding: 20px 20px 90px 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        .window-frame {
            background: #7a7a7a;
            border: 2px solid #ffffff;
            box-shadow: 4px 4px 0px #000000;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            position: relative;
        }

        .window-titlebar {
            background: #000000;
            color: #ffffff;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px solid #555555;
        }

        .window-title-left {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffb6c1;
            font-style: italic;
        }

        .window-controls {
            display: flex;
            gap: 4px;
        }

        .win-btn {
            background: #c0c0c0;
            border: 1px solid #ffffff;
            border-bottom-color: #000000;
            border-right-color: #000000;
            width: 16px;
            height: 16px;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000000;
        }

        .messages-container {
            background: #000000;
            position: relative;
            padding: 20px;
            min-height: 440px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .search-bar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 3;
        }

        .search-box {
            background: linear-gradient(90deg, #ff66b2, #ff007f, #ffb6c1);
            border-radius: 20px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 420px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
            border: 1px solid #ffffff;
        }

        .search-box svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 13px;
            width: 100%;
        }

        .search-box input::placeholder {
            color: #ffffff;
            opacity: 0.9;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
            position: relative;
            z-index: 3;
        }

        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            padding-bottom: 12px;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s;
        }

        .chat-item:hover {
            opacity: 0.85;
        }

        .chat-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ffb6c1, #ff007f, #ffb6c1, transparent);
        }

        .chat-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-container {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.7);
            border: 2px solid #ffffff;
            display: block;
        }

        .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 10px;
            height: 10px;
            background-color: #39ff14;
            border-radius: 50%;
            border: 2px solid #000000;
            box-shadow: 0 0 5px #39ff14;
        }

        .chat-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chat-name {
            font-size: 12px;
            font-weight: bold;
            font-style: italic;
        }

        .name-maiti { color: #3b82f6; }
        .name-laura { color: #a855f7; }
        .name-azu { color: #22c55e; }
        .name-sofia { color: #ec4899; }

        .chat-preview {
            background: transparent;
            border: 1px solid #ffb6c1;
            border-radius: 12px;
            padding: 3px 12px;
            font-size: 11px;
            color: #ffffff;
            display: inline-block;
            width: fit-content;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.3);
        }

        .chat-time {
            font-size: 11px;
            color: #ffffff;
            font-family: 'Courier New', monospace;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background: rgba(255, 182, 193, 0.95);
            backdrop-filter: blur(6px);
            border-top: 3px solid #ff007f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .nav-item {
            background: transparent;
            border: none;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-in-out;
            border-radius: 50%;
            cursor: pointer;
        }

        .nav-item img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ff007f;
            box-shadow: 0 0 6px rgba(255, 0, 127, 0.4);
            pointer-events: none;
        }

        .nav-item:hover {
            transform: scale(1.15) translateY(-2px);
            filter: drop-shadow(0 0 8px #ff007f);
        }

        .nav-item:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

            <div class="messages-container">

                <div class="bg-stars">

                    </svg>
                    <svg width="32" height="32" viewBox="0 0 100 100" fill="#ff007f">

            </div>
        </div>

    </div>

    <div class="bottom-bar">
        <button class="nav-item" onclick="window.location.href='home.html'" title="Inicio">
            <img src="../img/perfil.jfif" alt="Perfil">

            <img src="../img/notificaciones.jfif" alt="Notificaciones">
        </button>
    </div>

    <script>
    const Y2K_ITEMS = [
        `<svg viewBox="0 0 24 24" fill="#ff007f"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="#ffb6c1"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="#ff007f"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="#ffffff" stroke="#ff007f" stroke-width="1.5"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="#ff66b2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
    ];

    function createFallingItem() {
        const item = document.createElement('div');
        item.className = 'falling-item';
        item.innerHTML = Y2K_ITEMS[Math.floor(Math.random() * Y2K_ITEMS.length)];
        
        item.style.left = Math.random() * 100 + 'vw';
        
        const size = Math.random() * 10 + 16;
        item.style.width = size + 'px';
        item.style.height = size + 'px';
        
        const duration = Math.random() * 3 + 4;
        item.style.animationDuration = duration + 's';
        
        document.body.appendChild(item);

        setTimeout(() => {
            item.remove();
        }, duration * 1000);
    }

    setInterval(createFallingItem, 300);

    const colors = ['#ff007f', '#ff66b2', '#ffffff', '#ffb6c1'];
    let lastSparkleTime = 0;

    document.addEventListener('mousemove', function(e) {
        const now = Date.now();
        if (now - lastSparkleTime > 40) {
            createSparkle(e.clientX, e.clientY);
            lastSparkleTime = now;
        }
    });

    function createSparkle(x, y) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        
        const offsetX = (Math.random() - 0.5) * 15;
        const offsetY = (Math.random() - 0.5) * 15;
        sparkle.style.left = (x + offsetX) + 'px';
        sparkle.style.top = (y + offsetY) + 'px';
        
        sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        const size = Math.random() * 8 + 8;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';

        document.body.appendChild(sparkle);

        setTimeout(() => {
            sparkle.remove();
        }, 800);
    }
    </script>
</body>
